<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="leaflet.css" />
  <script src="leaflet.js"></script>
  <style>
    html,body{margin:0;padding:0;height:100%;width:100%;background:#12161b;overflow:hidden}
    #map{position:absolute;inset:0;height:100%;width:100%;background:#12161b}
    .bar{position:absolute;left:12px;right:12px;bottom:118px;z-index:1200;
      background:rgba(18,22,27,.92);border:1px solid rgba(255,255,255,.10);border-radius:16px;
      padding:10px 14px;display:flex;align-items:center;gap:12px;color:#EEF1F3;
      font-family:-apple-system,Roboto,Helvetica,sans-serif}
    .bar button{border:0;outline:0;width:34px;height:34px;border-radius:12px;background:#E9855C;
      color:#12161b;font-size:14px;flex:0 0 auto}
    .bar .t{font-size:12px;letter-spacing:.04em;opacity:.9;flex:1}
    .track{flex:2;height:4px;border-radius:2px;background:#333e48;position:relative}
    .track .fill{position:absolute;left:0;top:0;bottom:0;background:#E9855C;border-radius:2px;width:0}
    .leaflet-control-attribution,.leaflet-control-zoom{display:none}
  </style>
</head>
<body>
<div id="map"></div>
<div class="bar">
  <button id="pp">&#10073;&#10073;</button>
  <span class="t" id="ts">loading radar…</span>
  <div class="track"><div class="fill" id="fill"></div></div>
</div>
<script>
  function q(p){var m=new RegExp('[?&]'+p+'=([^&#]*)').exec(location.search);return m?decodeURIComponent(m[1]):null;}
  var lat=parseFloat(q('lat')), lon=parseFloat(q('lon'));
  if(isNaN(lat)) lat=20; if(isNaN(lon)) lon=0;

  var map=L.map('map',{zoomControl:false,attributionControl:false}).setView([lat,lon],7);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:12,minZoom:3,crossOrigin:true}).addTo(map);
  L.circleMarker([lat,lon],{radius:6,color:'#E9855C',weight:2,fillColor:'#E9855C',fillOpacity:.55}).addTo(map);
  setTimeout(function(){ map.invalidateSize(); }, 250);

  var frames=[], layers=[], idx=0, playing=true, timer=null;
  function url(ts){ return 'https://tilecache.rainviewer.com/v2/radar/'+ts+'/256/{z}/{x}/{y}/2/1_1.png'; }
  function show(i){
    for(var j=0;j<layers.length;j++){ if(layers[j]) layers[j].setOpacity(j===i?0.72:0); }
    var t=new Date(frames[i]*1000);
    document.getElementById('ts').textContent =
      ('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)
      + (i>=pastCount ? '  ·  forecast' : '');
    document.getElementById('fill').style.width=((i+1)/frames.length*100)+'%';
  }
  function step(){ idx=(idx+1)%frames.length; show(idx); }
  function play(){ playing=true; document.getElementById('pp').innerHTML='&#10073;&#10073;'; clearInterval(timer); timer=setInterval(step,650); }
  function pause(){ playing=false; document.getElementById('pp').textContent='▶'; clearInterval(timer); }
  document.getElementById('pp').onclick=function(){ playing?pause():play(); };

  var pastCount=0;
  console.log('radar: fetching rainviewer');
  fetch('https://api.rainviewer.com/public/weather-maps.json')
    .then(function(r){ console.log('radar: http ' + r.status); return r.json(); })
    .then(function(d){
      console.log('radar: frames=' + JSON.stringify(d.radar ? (d.radar.past||[]).length : 'n/a'));
      var past=[], now=[];
      if(d.radar){ (d.radar.past||[]).forEach(function(f){past.push(f.time);});
                   (d.radar.nowcast||[]).forEach(function(f){now.push(f.time);}); }
      else if(d.past){ d.past.forEach(function(f){past.push(f.time||f);}); }
      pastCount=past.length; frames=past.concat(now);
      if(!frames.length){ document.getElementById('ts').textContent='radar has no recent data'; return; }
      frames.forEach(function(ts){
        var l=L.tileLayer(url(ts),{opacity:0,maxZoom:12,minZoom:3});
        l.addTo(map); layers.push(l);
      });
      idx=Math.max(0,pastCount-1); show(idx); play();
    })
    .catch(function(e){ document.getElementById('ts').textContent='radar unavailable — check connection'; });
</script>
</body>
</html>
