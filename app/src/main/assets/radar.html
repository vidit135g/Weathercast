<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="leaflet.css" />
  <script src="leaflet.js"></script>
  <style>
    html,body{margin:0;padding:0;height:100%;width:100%;background:#12161b;overflow:hidden}
    #map{position:absolute;inset:0;background:#12161b}
    .chips{position:absolute;left:10px;right:10px;top:64px;z-index:1200;display:flex;gap:8px;
      overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0}
    .chips::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;font:600 12px -apple-system,Roboto,sans-serif;
      letter-spacing:.02em;background:rgba(18,22,27,.86);color:#B4BDC5;border:1px solid rgba(255,255,255,.10);white-space:nowrap}
    .chip.on{background:var(--accent,#E9855C);color:#12161b;border-color:transparent}
    .bar{position:absolute;left:12px;right:12px;bottom:118px;z-index:1200;
      background:rgba(18,22,27,.92);border:1px solid rgba(255,255,255,.10);border-radius:16px;
      padding:10px 14px;display:flex;align-items:center;gap:12px;color:#EEF1F3;font:12px -apple-system,Roboto,sans-serif}
    .bar .t{flex:1;letter-spacing:.04em;opacity:.9}
    .leaflet-control-attribution,.leaflet-control-zoom{display:none}
  </style>
</head>
<body>
<div id="map"></div>
<div class="chips" id="chips"></div>
<div class="bar"><span class="t" id="ts">Loading map…</span></div>
<script>
  function q(p){var m=new RegExp('[?&]'+p+'=([^&#]*)').exec(location.search);return m?decodeURIComponent(m[1]):null;}
  var lat=parseFloat(q('lat')), lon=parseFloat(q('lon'));
  if(isNaN(lat)) lat=20; if(isNaN(lon)) lon=0;
  var key=(q('key')||'').replace(/"/g,'');
  var accent=q('accent'); if(accent){ document.documentElement.style.setProperty('--accent','#'+accent); }

  var map=L.map('map',{zoomControl:false,attributionControl:false}).setView([lat,lon],7);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:14,minZoom:2,crossOrigin:true}).addTo(map);
  L.circleMarker([lat,lon],{radius:6,color:'#E9855C',weight:2,fillColor:'#E9855C',fillOpacity:.55}).addTo(map);
  setTimeout(function(){ map.invalidateSize(); }, 200);

  var LAYERS=[
    {id:'precipitation_new', label:'Rain'},
    {id:'clouds_new',        label:'Clouds'},
    {id:'wind_new',          label:'Wind'},
    {id:'temp_new',          label:'Temp'},
    {id:'pressure_new',      label:'Pressure'}
  ];
  var current=null;
  function setLayer(l){
    if(current){ map.removeLayer(current); current=null; }
    if(!key){ document.getElementById('ts').textContent='No API key — map only'; return; }
    current=L.tileLayer('https://tile.openweathermap.org/map/'+l.id+'/{z}/{x}/{y}.png?appid='+key,
      {opacity:0.8,maxZoom:14,minZoom:2,crossOrigin:true});
    current.addTo(map);
    document.getElementById('ts').textContent=l.label+' · live from OpenWeatherMap';
  }
  var chips=document.getElementById('chips');
  LAYERS.forEach(function(l,i){
    var c=document.createElement('div'); c.className='chip'+(i===0?' on':''); c.textContent=l.label;
    c.onclick=function(){
      [].forEach.call(chips.children,function(x){x.classList.remove('on');});
      c.classList.add('on'); setLayer(l);
    };
    chips.appendChild(c);
  });
  setLayer(LAYERS[0]);
</script>
</body>
</html>
