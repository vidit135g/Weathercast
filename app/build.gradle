plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing credentials live in keystore.properties (git-ignored, not this file) so the
// store/key password never lands in source control. Missing file = release build just won't be
// signed (debug builds are unaffected).
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.tac.Weathercast'
    compileSdkVersion 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.absolute.Weathercast"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 7
        versionName "1.3"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keystoreProps.containsKey("storeFile")) {
                def ks = file(keystoreProps["storeFile"])
                if (ks.exists()) {
                    storeFile ks
                    storePassword keystoreProps["storePassword"]
                    keyAlias keystoreProps["keyAlias"]
                    keyPassword keystoreProps["keyPassword"]
                }
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'MissingTranslation'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    implementation 'com.google.android.apps.dashclock:dashclock-api:2.0.0'
    implementation 'com.diogobernardino:williamchart:2.2'
    implementation 'com.github.xingstarx:MaterialSearchView:v1.4.2'
    implementation 'biz.laenger.android:vpbs:0.0.5'
    implementation 'com.github.castorflex.smoothprogressbar:library-circular:1.3.0'

    testImplementation 'junit:junit:4.13.2'
}
