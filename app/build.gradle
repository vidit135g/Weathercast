plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tac.Weathercast'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.absolute.Weathercast"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 6
        versionName "1.2"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            def ks = file("/Users/viditgupta/Documents/Project fix/release.keystore")
            if (ks.exists()) {
                storeFile ks
                storePassword "android123"
                keyAlias "releaseKey"
                keyPassword "android123"
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'MissingTranslation'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    implementation 'com.google.android.apps.dashclock:dashclock-api:2.0.0'
    implementation 'com.diogobernardino:williamchart:2.2'
    implementation 'com.github.xingstarx:MaterialSearchView:v1.4.2'
    implementation 'biz.laenger.android:vpbs:0.0.5'
    implementation 'com.github.castorflex.smoothprogressbar:library-circular:1.3.0'

    testImplementation 'junit:junit:4.13.2'
}
